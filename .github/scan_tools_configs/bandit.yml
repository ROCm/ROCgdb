# bandit configuration for ROCgdb
# Reference: https://bandit.readthedocs.io/en/latest/config.html
#
# This file replaces the rocm-security-gh org default wholesale (a
# repository-shipped bandit.yml is not layered onto the default).
#
# exclude_dirs below also accepts individual file paths. gdb/contrib,
# gdb/testsuite and sim are excluded wholesale since we don't ship any
# of those trees. The remaining individual files are inherited from
# upstream GDB/binutils tooling, unmodified by ROCm, and are excluded
# rather than fixed here to avoid carrying a local patch against
# upstream sources.

exclude_dirs:
  - .git
  - .venv
  - venv
  - build
  - dist
  - node_modules
  - contrib/mklog.py
  - etc/update-copyright.py
  - gdb/check-include-guards.py
  - gdb/contrib
  - gdb/copyright.py
  - gdb/python/lib/gdb/styling.py
  - gdb/syscalls/riscv-linux-canonicalize-syscall-gen.py
  - gdb/testsuite
  - sim
