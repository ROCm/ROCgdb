# zizmor configuration for rocm-security-gh
# Reference: https://docs.zizmor.sh/configuration/
#
# The default for repositories that ship no zizmor config of their own.
# A repository that ships one (`.github/zizmor.yml`, `.github/zizmor.yaml`,
# `zizmor.yml` or `zizmor.yaml`) replaces this file wholesale rather than
# layering onto it, so suppressions that belong to a single repository
# belong there. What goes here is what should hold for a repository that
# has said nothing.
#
# Per-rule ignore lists and tuning live under `rules:`, as
# `<rule-id>: { ignore: [file.yml:line:col] }`, which keeps a suppression
# reviewable in one place rather than scattered as inline comments
# across workflows.
rules:
  unpinned-images:
    ignore:
      # inputs.build_image is a workflow_call input; zizmor cannot trace it
      # back through the caller chain (nightly-build.yml / therock-ci.yml)
      # to its source in .github/configs.json, where it is already pinned
      # by digest (build_image: ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:...).
      - therock-ci-linux.yml:42:7
