name: TheRock Test Packages single-node

on:
  workflow_call:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
        default: ""
      therock_ref:
        type: string
        required: true
      artifact_run_id:
        type: string
      test_options:
        type: string
        description: 'Job-specific options appended to each component test_script.'
        default: ''
      projects_to_test:
        type: string
        description: 'Components to build the test matrix for.'
        default: 'rocgdb-cpu,rocgdb-gpu,rocgdb-corefile'
  workflow_dispatch:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
        default: ""
      therock_ref:
        type: string
        required: true
      artifact_run_id:
        type: string
      test_options:
        type: string
        description: 'Job-specific options appended to each component test_script.'
        default: ''
      projects_to_test:
        type: string
        description: 'Components to build the test matrix for.'
        default: 'rocgdb-cpu,rocgdb-gpu,rocgdb-corefile'

permissions:
  contents: read

env:
  VENV_DIR: ${{ github.workspace }}/.venv

jobs:
  configure_test_matrix:
    name: "Configure test matrix"
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.patch-scripts.outputs.components }}
      cpu_runs_on: ${{ steps.runner.outputs.cpu_runs_on }}
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ inputs.therock_ref }}

      - name: Checkout CI config
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ROCm/therock-ci-config
          ref: main
          path: ci-config
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Checkout ROCgdb (scripts only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ROCm/ROCgdb
          sparse-checkout: .github/scripts
          path: rocgdb-scripts

      - name: Select CPU runner
        id: runner
        run: python3 rocgdb-scripts/.github/scripts/select_runner.py cpu_runs_on

      - name: Configure test matrix
        env:
          PROJECTS_TO_TEST: ${{ inputs.projects_to_test }}
          AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
          CI_CONFIG_PATH: ci-config
        id: configure
        run: python ./build_tools/github_actions/fetch_test_configurations.py

      - name: Patch rocgdb test_script options
        # Append caller-supplied options to each component's test_script.
        # When test_options contains --tests, first strip any pre-existing
        # --tests from the upstream test_script so the caller's value wins
        # explicitly rather than relying on argparse last-wins behaviour.
        id: patch-scripts
        env:
          COMPONENTS: ${{ steps.configure.outputs.components }}
          TEST_OPTIONS: ${{ inputs.test_options }}
        run: |
          strip_tests=false
          if [[ " $TEST_OPTIONS " == *" --tests "* ]]; then
            strip_tests=true
          fi
          updated=$(echo "$COMPONENTS" | jq -c \
            --arg opts "$TEST_OPTIONS" \
            --argjson strip "$strip_tests" '
            map(
              .test_script |= (
                if $strip then gsub("--tests(\\s+[^-]\\S*)*"; "") else . end
                | if $opts != "" then . + " " + $opts else . end
                | gsub("  +"; " ") | sub("\\s+$"; "")
              )
            )
          ')
          echo "components=$updated" >> $GITHUB_OUTPUT

  test_components:
    name: "Test ${{ matrix.components.job_name }}"
    needs: [configure_test_matrix]
    if: ${{ needs.configure_test_matrix.outputs.components != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        components: ${{ fromJSON(needs.configure_test_matrix.outputs.components) }}
    uses: ./.github/workflows/therock-test-component.yml
    with:
      artifact_run_id: ${{ inputs.artifact_run_id }}
      therock_ref: ${{ inputs.therock_ref }}
      amdgpu_families: ${{ inputs.amdgpu_families }}
      artifact_group: ${{ inputs.artifact_group }}
      # Per-component runner selection:
      #   1. CPU-only components use the runner from therock-ci-config
      #   2. GPU components use the per-component runner from fetch_test_configurations.py
      test_runs_on: >-
        ${{
          (matrix.components.linux_cpu_runner == true &&
            needs.configure_test_matrix.outputs.cpu_runs_on) ||
          matrix.components.test_runner
        }}
      component: ${{ toJSON(matrix.components) }}
