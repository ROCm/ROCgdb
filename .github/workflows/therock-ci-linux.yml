name: TheRock CI Linux

on:
  workflow_call:
    inputs:
      amdgpu_families:
        type: string
      artifact_group:
        type: string
      extra_cmake_options:
        type: string
      build_runs_on:
        type: string
        default: aws-linux-scale-rocm-prod

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve TheRock references
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.read.outputs.commit }}
      image: ${{ steps.read.outputs.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Read TheRock dependency pins
        id: read
        shell: bash
        run: |
          read -r commit image < <(python3 -c "
import json, sys
try:
    with open('.github/configs.json') as f:
        d = json.load(f)
    print(d['therock_commit_ref'], d['build_image'])
except FileNotFoundError:
    print('configs.json not found', file=sys.stderr); sys.exit(1)
except json.JSONDecodeError as e:
    print(f'configs.json is not valid JSON: {e}', file=sys.stderr); sys.exit(1)
except KeyError as e:
    print(f'Missing key in configs.json: {e}', file=sys.stderr); sys.exit(1)
") || { echo 'Failed to read configs.json' >&2; exit 1; }
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid therock_commit_ref: $commit" >&2; exit 1
          fi
          if ! [[ "$image" =~ ^ghcr\.io/[^@]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid build_image: $image" >&2; exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  therock-build-linux:
    name: Build Linux Packages
    needs: resolve
    runs-on: ${{ inputs.build_runs_on }}
    permissions:
      contents: read
      id-token: write
    outputs:
      therock_ref: ${{ needs.resolve.outputs.commit }}
    container:
      image: ${{ needs.resolve.outputs.image }}
    env:
      THEROCK_COMMIT_REF: ${{ needs.resolve.outputs.commit }}
      AMDGPU_FAMILIES: ${{ inputs.amdgpu_families }}
      TEATIME_FORCE_INTERACTIVE: 0
      CACHE_DIR: ${{ github.workspace }}/.container-cache
      CCACHE_CONFIGPATH: ${{ github.workspace }}/.ccache/ccache.conf

    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Checkout CI config
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ROCm/therock-ci-config
          ref: main
          path: ci-config
        continue-on-error: true

      - name: Checkout rocGDB repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: rocgdb_under_test

      - name: Install python deps
        run: |
          pip install -r requirements.txt

      - name: Adjust git config
        run: |
          git config --global --add safe.directory $PWD
          git config fetch.parallel 10

      - name: Setup ccache
        run: |
          ./build_tools/setup_ccache.py \
            --config-preset "github-oss-dev" \
            --dir "$(dirname $CCACHE_CONFIGPATH)" \
            --local-path "$CACHE_DIR/ccache"

      - name: Runner health status
        run: |
          ./build_tools/health_status.py

      - name: Fetch sources
        run: |
          ./build_tools/fetch_sources.py --jobs 12

      - name: Configure Projects
        env:
          amdgpu_families: ${{ env.AMDGPU_FAMILIES }}
          package_version: ADHOCBUILD
          extra_cmake_options: ${{ inputs.extra_cmake_options }}
          BUILD_DIR: build
          CI_CONFIG_PATH: ci-config
        run: |
          python3 build_tools/github_actions/build_configure.py

      - name: Build therock-dist
        run: cmake --build build

      - name: Build therock-artifacts
        run: cmake --build build --target therock-artifacts

      - name: Report
        run: |
          echo "Full SDK du:"
          echo "------------"
          du -h -d 1 build/dist/rocm
          echo "Artifacts:"
          echo "----------"
          du -h -d 1 build/artifacts
          echo "CCache Stats:"
          echo "-------------"
          ccache -s -v
          tail -v -n +1 .ccache/compiler_check_cache/* > build/logs/ccache_compiler_check_cache.log

      - name: Configure AWS Credentials for non-forked repos
        if: ${{ always() && !github.event.pull_request.head.repo.fork }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: us-east-2
          role-to-assume: arn:aws:iam::692859939525:role/therock-ci-external

      - name: Push artifacts
        run: |
          python3 build_tools/artifact_manager.py push \
            --run-id ${{ github.run_id }} \
            --build-dir build \
            --stage all

      - name: Post Build Upload
        if: always() && !github.event.pull_request.head.repo.fork
        run: |
          python3 build_tools/github_actions/post_build_upload.py \
            --run-id ${{ github.run_id }} \
            --artifact-group ${{ env.AMDGPU_FAMILIES }} \
            --build-dir build \
            --upload

  therock-test-linux:
    name: "Run Tests"
    if: ${{ inputs.amdgpu_families == 'gfx94X-dcgpu' }}
    needs: [therock-build-linux]
    uses: ./.github/workflows/therock-test-packages.yml
    with:
      amdgpu_families: ${{ inputs.amdgpu_families }}
      artifact_group: ${{ inputs.artifact_group }}
      therock_ref: ${{ needs.therock-build-linux.outputs.therock_ref }}
      artifact_run_id: ${{ github.run_id }}
