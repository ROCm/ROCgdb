name: TheRock CI for rocgdb

on:
  push:
    branches:
      - amd-staging
      - amd-staging-rocgdb-*
  pull_request:
    branches:
      - amd-staging
      - amd-staging-rocgdb-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  setup:
    runs-on: ubuntu-24.04
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'ci:skip') }}
    env:
      BASE_REF: HEAD^
    outputs:
      enable_therock_ci: ${{ steps.configure.outputs.enable_therock_ci }}
      build_runs_on: ${{ steps.runner.outputs.build_runs_on }}
    steps:
      - name: "Checking out repository"
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 2

      - name: "Configuring CI options"
        id: configure
        run: python .github/scripts/therock_configure_ci.py

      - name: Checkout CI config
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ROCm/therock-ci-config
          ref: main
          path: ci-config
        continue-on-error: true

      - name: Select build runner
        id: runner
        run: |
          python3 - <<'EOF'
          import json, os, sys
          from pathlib import Path

          ci_config = Path("ci-config")
          default_runner = "aws-linux-scale-rocm-prod"

          label = default_runner
          if (ci_config / "runner-config.json").exists():
              try:
                  sys.path.insert(0, str(ci_config))
                  from ci_config_api import load_config_v1
                  config = load_config_v1(ci_config)
                  candidates = config.build_runners.get("linux", {}).get("default", [])
                  best = max(candidates, key=lambda e: e["weight"], default=None)
                  if best:
                      label = best["label"]
              except Exception as e:
                  print(f"Failed to load ci_config_api, using default: {e}", file=sys.stderr)
          else:
              print(f"ci-config not found, using default: {default_runner}", file=sys.stderr)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"build_runs_on={label}\n")
          print(f"build_runs_on={label}")
          EOF

  therock-ci-linux:
    name: TheRock CI Linux
    needs: setup
    if: ${{ needs.setup.outputs.enable_therock_ci == 'true' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        amdgpu_family: [gfx94X-dcgpu]
    uses: ./.github/workflows/therock-ci-linux.yml
    secrets: inherit
    with:
      amdgpu_families: ${{ matrix.amdgpu_family }}
      artifact_group: ${{ matrix.amdgpu_family }}
      build_runs_on: ${{ needs.setup.outputs.build_runs_on }}
      extra_cmake_options: >
        -DTHEROCK_ENABLE_ALL=OFF 
        -DTHEROCK_BUILD_TESTING=ON 
        -DTHEROCK_ENABLE_DEBUG_TOOLS=ON
        -DTHEROCK_SHARED_PYTHON_EXECUTABLES=/opt/python-shared/cp310-cp310/bin/python3;/opt/python-shared/cp311-cp311/bin/python3;/opt/python-shared/cp312-cp312/bin/python3;/opt/python-shared/cp313-cp313/bin/python3;/opt/python-shared/cp314-cp314/bin/python3
        -DTHEROCK_DIST_PYTHON_EXECUTABLES=/opt/python/cp310-cp310/bin/python;/opt/python/cp311-cp311/bin/python;/opt/python/cp312-cp312/bin/python;/opt/python/cp313-cp313/bin/python
        -DTHEROCK_USE_EXTERNAL_ROCGDB=ON
        -DTHEROCK_ROCGDB_SOURCE_DIR=./rocgdb_under_test

  therock_ci_summary:
    name: TheRock CI Summary
    if: always()
    needs:
      - setup
      - therock-ci-linux
    runs-on: ubuntu-24.04
    steps:
      - name: Output failed jobs
        run: |
          echo '${{ toJson(needs) }}'
          FAILED_JOBS="$(echo '${{ toJson(needs) }}' \
            | jq --raw-output \
            'map_values(select(.result!="success" and .result!="skipped")) | keys | join(",")' \
          )"
          if [[ "${FAILED_JOBS}" != "" ]]; then
            echo "The following jobs failed: ${FAILED_JOBS}"
            exit 1
          fi
