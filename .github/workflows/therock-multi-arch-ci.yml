# Multi-Arch CI for rocgdb
#
# Calls TheRock's reusable multi-arch CI workflows. The TheRock ref and
# baseline run ID are read from .github/configs.json, which is kept fresh
# by the therock-deps-update.yml workflow (runs every 6 hours). The
# baseline run supplies pre-built artifacts for stages that rocgdb does
# not affect so that only compiler-runtime and debug-tools are rebuilt.

name: TheRock Multi-Arch CI

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      linux_amdgpu_families:
        type: string
        description: "Insert comma-separated list of Linux GPU families to build and test. ex: gfx94X, gfx120X (empty = skip linux)"
        default: ""
      linux_test_labels:
        type: string
        description: "If enabled, reduce test set on Linux to the list of labels prefixed with 'test:'. ex: test:rocgdb"
        default: ""
      prebuilt_stages:
        type: string
        default: ""
        description: "Comma-separated build stages to skip; overrides configs.json when set"
      baseline_run_id:
        type: string
        default: ""
        description: "Workflow run ID to copy prebuilt stage artifacts from; overrides configs.json when set"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  resolve:
    name: Resolve TheRock pins
    runs-on: ubuntu-24.04
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        contains(github.event.pull_request.labels.*.name, 'ci:multi-arch')
      }}
    outputs:
      therock_ref: ${{ steps.pins.outputs.therock_ref }}
      baseline_run_id: ${{ steps.pins.outputs.baseline_run_id }}
      prebuilt_stages: ${{ steps.pins.outputs.prebuilt_stages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: .github/configs.json
          sparse-checkout-cone-mode: false

      - name: Read pins from configs.json
        id: pins
        run: |
          python3 - <<'EOF'
          import json, os, re, sys

          SHA_RE = re.compile(r'^[0-9a-f]{40}$')
          RUN_ID_RE = re.compile(r'^\d+$')
          PREBUILT = "runtime-tests,wsl-rocdxg,math-libs,comm-libs,storage-libs,dctools-core,profiler-apps,cv-libs,media-libs"

          d = json.load(open('.github/configs.json'))

          ref = d.get('therock_commit_ref', '')
          if not SHA_RE.match(ref):
              print(f"ERROR: therock_commit_ref is not a valid SHA-40: {ref!r}", file=sys.stderr)
              sys.exit(1)

          run_id = d.get('therock_baseline_run_id', '')
          if run_id and not RUN_ID_RE.match(run_id):
              print(f"ERROR: therock_baseline_run_id is not a valid run ID: {run_id!r}", file=sys.stderr)
              sys.exit(1)

          out = os.environ['GITHUB_OUTPUT']
          with open(out, 'a') as f:
              f.write(f"therock_ref={ref}\n")
              f.write(f"baseline_run_id={run_id}\n")
              f.write(f"prebuilt_stages={PREBUILT if run_id else ''}\n")
          EOF

  setup:
    needs: resolve
    uses: ROCm/TheRock/.github/workflows/setup_multi_arch.yml@main
    permissions:
      contents: read
      actions: read
    with:
      build_variant: "release"
      linux_amdgpu_families: ${{ inputs.linux_amdgpu_families || 'gfx94X,gfx950' }}
      linux_test_labels: ${{ inputs.linux_test_labels || 'test:rocgdb' }}
      prebuilt_stages: ${{ inputs.prebuilt_stages || needs.resolve.outputs.prebuilt_stages }}
      baseline_run_id: ${{ inputs.baseline_run_id || needs.resolve.outputs.baseline_run_id }}
      repository: ROCm/TheRock
      ref: ${{ needs.resolve.outputs.therock_ref }}
      external_repo: '{"repository":"${{ github.repository }}","ref":"${{ github.sha }}","extra_cmake_options":"-DTHEROCK_USE_EXTERNAL_ROCGDB=ON"}'

  linux_build_and_test:
    name: Linux::${{ fromJSON(needs.setup.outputs.linux_build_config || '{}').build_variant_label || 'skip' }}
    needs: [resolve, setup]
    if: >-
      ${{
        needs.setup.outputs.linux_build_config != '' &&
        needs.setup.outputs.enable_build_jobs == 'true'
      }}
    uses: ROCm/TheRock/.github/workflows/multi_arch_ci_linux.yml@main
    secrets: inherit
    with:
      build_config: ${{ needs.setup.outputs.linux_build_config }}
      test_labels: ${{ needs.setup.outputs.linux_test_labels }}
      rocm_package_version: ${{ needs.setup.outputs.rocm_package_version }}
      test_type: ${{ needs.setup.outputs.test_type }}
      external_repo_config: ${{ needs.setup.outputs.external_repo_config }}
      repository: ROCm/TheRock
      ref: ${{ needs.setup.outputs.ref }}
    permissions:
      contents: read
      id-token: write

  multi_arch_ci_summary:
    name: Multi-Arch CI Summary
    if: always()
    needs:
      - setup
      - linux_build_and_test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TheRock repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: "ROCm/TheRock"
          ref: ${{ needs.setup.outputs.ref }}
          sparse-checkout: build_tools/github_actions
          sparse-checkout-cone-mode: true

      - name: Evaluate workflow results
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python build_tools/github_actions/workflow_summary.py \
            --needs-json '${{ toJSON(needs) }}'
