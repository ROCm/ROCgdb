# A PDB with the companion PE's GUID and a different age, __BAD_AGE__.  The
# reader checks the identity right after the PDB info stream and refuses the
# file there, so no other stream of it is read.
---
PdbStream:
  Age:             __BAD_AGE__
  Guid:            '__GUID__'
  Signature:       0
  Features:        [ VC140 ]
  Version:         VC70
DbiStream:
  VerHeader:       V70
  Age:             __BAD_AGE__
  MachineType:     Amd64
  Modules:         []
TpiStream:
  Version:         VC80
  Records:         []
IpiStream:
  Version:         VC80
  Records:         []
...
