# Line-table coverage.  A module carrying only C13 DEBUG_S_FILECHKSMS +
# DEBUG_S_LINES subsections, checked through the raw maint dumps.  The module
# intentionally has no symbol records.  pdb-yaml-infocmd and pdb-yaml-inline
# combine symbols with C13 subsections in the same module.
---
PdbStream:
  Age:             __AGE__
  Guid:            '__GUID__'
  Signature:       0
  Features:        [ VC140 ]
  Version:         VC70
DbiStream:
  VerHeader:       V70
  Age:             __AGE__
  MachineType:     Amd64
  Modules:
    - Module:          pdb-yaml-lines.obj
      ObjFile:         pdb-yaml-lines.obj
      SourceFiles:
        - pdb-yaml-lines.cpp
      Subsections:
        - !FileChecksums
          Checksums:
            - FileName:        pdb-yaml-lines.cpp
              Kind:            MD5
              Checksum:        000102030405060708090A0B0C0D0E0F
        - !Lines
          CodeSize:        24
          Flags:           [  ]
          RelocOffset:     0
          RelocSegment:    1
          Blocks:
            - FileName:        pdb-yaml-lines.cpp
              Lines:
                - Offset:          0
                  LineStart:       10
                  IsStatement:     true
                  EndDelta:        0
                - Offset:          8
                  LineStart:       11
                  IsStatement:     true
                  EndDelta:        0
                - Offset:          16
                  LineStart:       12
                  IsStatement:     true
                  EndDelta:        0
              Columns:         []
      Modi:
        Signature:       4
        Records:         []
TpiStream:
  Version:         VC80
  Records:         []
IpiStream:
  Version:         VC80
  Records:         []
...
